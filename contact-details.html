<!DOCTYPE html>
<html lang="en" class="govuk-template">
  <head>
    <meta charset="utf-8">
    <title>How would you like employers to contact you? - Work Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0c0c">
    <link rel="icon" sizes="48x48" href="vendor/govuk/assets/images/favicon.ico">
    <link rel="stylesheet" href="vendor/govuk/govuk-frontend.min.css">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/auth.js"></script>
  </head>
  <body class="govuk-template__body">
    <script>document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');</script>

    <header data-workhub-header></header>

    <div class="govuk-width-container">
      <a href="contact-name.html" class="govuk-back-link">Back</a>

      <main class="govuk-main-wrapper" id="main-content">
        <div class="govuk-grid-row">
          <div class="govuk-grid-column-two-thirds">

            <form id="contact-methods-form" novalidate>
              <div class="govuk-form-group">
                <fieldset class="govuk-fieldset" aria-describedby="contact-methods-hint contact-methods-shown">
                  <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
                    <span class="govuk-caption-l">Contact details</span>
                    <h1 class="govuk-fieldset__heading">How would you like employers to contact you?</h1>
                  </legend>
                  <div id="contact-methods-hint" class="govuk-hint">Select all that apply</div>

                  <div class="govuk-checkboxes" data-module="govuk-checkboxes">
                    <div class="govuk-checkboxes__item">
                      <input class="govuk-checkboxes__input" id="contact-email" name="methods" type="checkbox"
                             value="email" data-aria-controls="conditional-contact-email">
                      <label class="govuk-label govuk-checkboxes__label" for="contact-email">Email</label>
                    </div>
                    <div class="govuk-checkboxes__conditional govuk-checkboxes__conditional--hidden" id="conditional-contact-email">
                      <div class="govuk-form-group">
                        <label class="govuk-label" for="email-address">Email address</label>
                        <input class="govuk-input" id="email-address" name="email" type="email"
                               autocomplete="email" spellcheck="false">
                      </div>
                    </div>

                    <div class="govuk-checkboxes__item">
                      <input class="govuk-checkboxes__input" id="contact-phone" name="methods" type="checkbox"
                             value="phone" data-aria-controls="conditional-contact-phone">
                      <label class="govuk-label govuk-checkboxes__label" for="contact-phone">Phone</label>
                    </div>
                    <div class="govuk-checkboxes__conditional govuk-checkboxes__conditional--hidden" id="conditional-contact-phone">
                      <div class="govuk-form-group">
                        <label class="govuk-label" for="phone-number">Phone number</label>
                        <input class="govuk-input" id="phone-number" name="phone" type="tel" autocomplete="tel">
                      </div>
                    </div>
                  </div>

                  <div id="contact-methods-shown" class="govuk-hint govuk-!-margin-top-4">These will show under your name.</div>
                </fieldset>
              </div>

              <button type="submit" class="govuk-button" data-module="govuk-button">Done</button>
            </form>

          </div>
        </div>
      </main>
    </div>

    <footer class="govuk-footer" data-workhub-footer></footer>

    <script type="module" src="assets/chrome.js"></script>
    <script src="assets/store.js"></script>
    <script src="assets/flows.js"></script>
    <script src="assets/sections.js"></script>
  </body>
</html>
