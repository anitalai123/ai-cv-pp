<!DOCTYPE html>
<html lang="en" class="govuk-template">
  <head>
    <meta charset="utf-8">
    <title>AI feedback - Work Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0c0c">
    <link rel="icon" sizes="48x48" href="vendor/govuk/assets/images/favicon.ico">
    <link rel="stylesheet" href="vendor/govuk/govuk-frontend.min.css">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/auth.js"></script>
  </head>
  <body class="govuk-template__body">
    <script>document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');</script>

    <header data-workhub-header></header>

    <div class="govuk-width-container">
      <a href="ai-feedback.html" class="govuk-back-link" id="feedback-back-link">Back</a>

      <main class="govuk-main-wrapper" id="main-content">
        <div class="govuk-grid-row">
          <div class="govuk-grid-column-two-thirds">

            <span class="govuk-caption-l">AI feedback for Personal Profile</span>
            <h1 class="govuk-heading-l workhub-feedback-title" id="feedback-title"></h1>
            <p class="govuk-body workhub-must-change-line" id="feedback-must-change" hidden>
              <strong class="govuk-tag workhub-must-change">Must change</strong>
            </p>

            <h2 class="govuk-heading-s workhub-feedback-label" id="feedback-label"></h2>
            <div class="govuk-inset-text workhub-inset-text--feedback" id="feedback-details"></div>

            <form id="feedback-form" novalidate>
              <div class="govuk-character-count" data-module="govuk-character-count" data-maxlength="1000">
                <div class="govuk-form-group">
                  <label class="govuk-label govuk-label--s" for="personal-profile">
                    Your personal profile
                  </label>
                  <textarea class="govuk-textarea govuk-js-character-count" id="personal-profile"
                            name="personalProfile" rows="10"
                            aria-describedby="personal-profile-info"></textarea>
                </div>
                <div id="personal-profile-info" class="govuk-hint govuk-character-count__message">
                  You have 1,000 characters remaining
                </div>
              </div>

              <!-- Options 1 and 2: walk the feedback in order. -->
              <div class="govuk-button-group" id="feedback-buttons">
                <button type="submit" class="govuk-button" data-module="govuk-button" id="feedback-next">
                  Next feedback
                </button>
                <button type="button" class="govuk-button govuk-button--secondary" data-module="govuk-button" id="feedback-done">
                  Done
                </button>
              </div>

              <!-- Iteration after UR: a checkbox marks the piece as done, and
                   both buttons save the profile and the checkbox. -->
              <div class="govuk-form-group" id="feedback-mark-done-group" hidden>
                <div class="govuk-checkboxes" data-module="govuk-checkboxes">
                  <div class="govuk-checkboxes__item">
                    <input class="govuk-checkboxes__input" id="feedback-mark-done" name="markDone" type="checkbox" value="yes">
                    <label class="govuk-label govuk-checkboxes__label" for="feedback-mark-done">
                      Mark as done
                    </label>
                  </div>
                </div>
              </div>

              <div class="govuk-button-group" id="feedback-buttons-iterated" hidden>
                <button type="submit" class="govuk-button" data-module="govuk-button" id="feedback-next-iterated">
                  Next feedback
                </button>
                <button type="button" class="govuk-button govuk-button--secondary" data-module="govuk-button" id="feedback-to-list">
                  Back to all feedback
                </button>
              </div>
            </form>

            <p class="govuk-body" id="feedback-back-line">
              <a class="govuk-link" href="ai-feedback.html" id="feedback-back">Back to all feedback</a>
            </p>

          </div>
        </div>
      </main>
    </div>

    <footer class="govuk-footer" data-workhub-footer></footer>

    <script type="module" src="assets/chrome.js"></script>
    <script src="assets/store.js"></script>
    <script src="assets/flows.js"></script>
    <script src="assets/ai-flow.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        /* Already fetched on the feedback page, so this reads the saved
           response rather than asking again. */
        const feedback = savedFeedback() || PLACEHOLDER_FEEDBACK;
        const items = feedback.items.length ? feedback.items : PLACEHOLDER_FEEDBACK.items;

        const n = feedbackIndex(items.length);
        const item = items[n - 1];

        document.getElementById('feedback-title').textContent = item.title;
        document.getElementById('feedback-details').textContent = item.details;
        document.getElementById('feedback-label').innerHTML = AI_ICON + 'AI feedback';
        /* Whatever was written last, including edits made on the feedback page
           before this one. */
        const textarea = document.getElementById('personal-profile');
        textarea.value = Store.read().profile || '';
        // GOV.UK Frontend has already counted an empty textarea by this point.
        textarea.dispatchEvent(new Event('input', { bubbles: true }));

        function save() {
          Store.write({ profile: textarea.value.trim() });
        }

        if (window.protoIterated) {
          setUpIterated();
        } else {
          setUpOriginal();
        }

        function setUpOriginal() {
          const isLast = n === items.length;
          if (item.mustChange) document.getElementById('feedback-must-change').hidden = false;

          function finish() {
            save();
            /* Once the last piece of feedback is done, the task list goes back
               to the profile as it now stands rather than to the feedback. */
            ProfileResume.leavingFrom(isLast ? 'profile.html' : undefined);
            Flash.set('Personal Profile updated');
            window.location.href = 'task-list.html';
          }

          const next = document.getElementById('feedback-next');
          const done = document.getElementById('feedback-done');

          /* The last piece of feedback has nowhere to go next, so Done is the
             primary action there instead of a second button. */
          if (isLast) {
            done.hidden = true;
            next.textContent = 'Done';
          }

          document.getElementById('feedback-form').addEventListener('submit', function (event) {
            event.preventDefault();
            if (isLast) {
              finish();
              return;
            }
            save();
            window.location.href = 'feedback-edit.html?n=' + (n + 1);
          });

          done.addEventListener('click', finish);
        }

        function setUpIterated() {
          document.getElementById('feedback-buttons').hidden = true;
          document.getElementById('feedback-buttons-iterated').hidden = false;

          const markDone = document.getElementById('feedback-mark-done');
          document.getElementById('feedback-mark-done-group').hidden = false;
          markDone.checked = feedbackDone().indexOf(n) !== -1;

          /* Must change goes once the piece is marked as done, as it does on
             the feedback list, and nothing takes its place here. */
          if (item.mustChange && !markDone.checked) {
            document.getElementById('feedback-must-change').hidden = false;
          }

          function saveAll() {
            save();
            markFeedbackDone(n, markDone.checked);
          }

          /* Next feedback goes to the next piece not yet done, wrapping round
             from the last to any left before it. Which pieces those are
             depends on the checkbox, so it is worked out on the way out. */
          function nextNotDone() {
            const done = feedbackDone();
            const others = items.map(function (it, i) { return i + 1; }).filter(function (m) {
              return m !== n && done.indexOf(m) === -1;
            });
            return others.filter(function (m) { return m > n; })[0] || others[0];
          }

          /* When every other piece is done there is no next one, so Back to
             all feedback is the only button and takes over as the primary. */
          const next = document.getElementById('feedback-next-iterated');
          const toList = document.getElementById('feedback-to-list');
          if (!nextNotDone()) {
            next.hidden = true;
            toList.classList.remove('govuk-button--secondary');
          }

          document.getElementById('feedback-form').addEventListener('submit', function (event) {
            event.preventDefault();
            saveAll();
            const nextN = nextNotDone();
            window.location.href = nextN ? 'feedback-edit.html?n=' + nextN : 'ai-feedback.html';
          });

          /* The grey button takes over from the Back to all feedback link,
             so the link goes. */
          document.getElementById('feedback-back-line').hidden = true;
          toList.addEventListener('click', function () {
            saveAll();
            window.location.href = 'ai-feedback.html';
          });
        }

        document.getElementById('feedback-back').addEventListener('click', save);

        /* Back goes wherever the person came from - the feedback list, or the
           previous piece of feedback - rather than always to the list. Tested on
           the history itself rather than document.referrer, which browsers leave
           empty often enough that the link fell through to its href instead.
           That href stays as the fallback for a page opened cold in a new tab. */
        document.getElementById('feedback-back-link').addEventListener('click', function (event) {
          if (window.history.length <= 1) return;
          event.preventDefault();
          save();
          window.history.back();
        });
      });
    </script>
  </body>
</html>
