<!DOCTYPE html>
<html lang="en" class="govuk-template">
  <head>
    <meta charset="utf-8">
    <title>Add a section - Work Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0c0c">
    <link rel="icon" sizes="48x48" href="vendor/govuk/assets/images/favicon.ico">
    <link rel="stylesheet" href="vendor/govuk/govuk-frontend.min.css">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/auth.js"></script>
  </head>
  <body class="govuk-template__body">
    <script>document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');</script>

    <header data-workhub-header></header>

    <div class="govuk-width-container">
      <a href="task-list.html" class="govuk-back-link">Back</a>

      <main class="govuk-main-wrapper" id="main-content">
        <div class="govuk-grid-row">
          <div class="govuk-grid-column-two-thirds">

            <span class="govuk-caption-l">Add a section</span>
            <h1 class="govuk-heading-l">Add a section</h1>

            <p class="govuk-body">Use this section to add things like skills, awards, interests or licences.</p>

            <form id="additional-info-form" novalidate>
              <div class="govuk-form-group">
                <label class="govuk-label govuk-label--s" for="section-title">Title</label>
                <input class="govuk-input" id="section-title" name="title" type="text">
              </div>

              <div class="govuk-character-count" data-module="govuk-character-count" data-maxlength="1000">
                <div class="govuk-form-group">
                  <label class="govuk-label govuk-label--s" for="section-details">Details</label>
                  <textarea class="govuk-textarea govuk-js-character-count" id="section-details"
                            name="details" rows="8" aria-describedby="section-details-info"></textarea>
                </div>
                <div id="section-details-info" class="govuk-hint govuk-character-count__message">
                  You have 1,000 characters remaining
                </div>
              </div>

              <button type="submit" class="govuk-button" data-module="govuk-button">Done</button>
            </form>

          </div>
        </div>
      </main>
    </div>

    <footer class="govuk-footer" data-workhub-footer></footer>

    <script type="module" src="assets/chrome.js"></script>
    <script src="assets/store.js"></script>
    <script src="assets/flows.js"></script>
    <script src="assets/sections.js"></script>
  </body>
</html>
