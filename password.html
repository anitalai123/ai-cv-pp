<!DOCTYPE html>
<html lang="en" class="govuk-template">
  <head>
    <meta charset="utf-8">
    <title>AI CV Personal profile feedback</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0c0c">
    <link rel="icon" sizes="48x48" href="vendor/govuk/assets/images/favicon.ico">
    <link rel="stylesheet" href="vendor/govuk/govuk-frontend.min.css">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/auth.js"></script>
  </head>
  <body class="govuk-template__body">
    <script>document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');</script>

    <header data-workhub-header="minimal"></header>

    <div class="govuk-width-container">
      <main class="govuk-main-wrapper" id="main-content">
        <div class="govuk-grid-row">
          <div class="govuk-grid-column-two-thirds">

            <div class="govuk-error-summary" id="password-error-summary" tabindex="-1" hidden>
              <div role="alert">
                <h2 class="govuk-error-summary__title">There is a problem</h2>
                <div class="govuk-error-summary__body">
                  <ul class="govuk-list govuk-error-summary__list">
                    <li><a href="#password">The password is not correct</a></li>
                  </ul>
                </div>
              </div>
            </div>

            <h1 class="govuk-heading-l">AI CV Personal profile feedback</h1>

            <form id="password-form" novalidate>
              <div class="govuk-form-group" id="password-form-group">
                <label class="govuk-label govuk-label--s" for="password">Enter a password</label>
                <p class="govuk-error-message" id="password-error" hidden>
                  <span class="govuk-visually-hidden">Error:</span> The password is not correct
                </p>
                <input class="govuk-input" id="password" name="password" type="password"
                       spellcheck="false" autocomplete="current-password" autocapitalize="none"
                       aria-describedby="password-error">
              </div>

              <button type="submit" class="govuk-button" data-module="govuk-button">Continue</button>
            </form>

          </div>
        </div>
      </main>
    </div>

    <footer class="govuk-footer" data-workhub-footer></footer>

    <script type="module" src="assets/chrome.js"></script>
    <script>
      document.getElementById('password-form').addEventListener('submit', function (event) {
        event.preventDefault();

        const field = document.getElementById('password');
        const summary = document.getElementById('password-error-summary');
        const message = document.getElementById('password-error');
        const group = document.getElementById('password-form-group');

        if (field.value.trim().toLowerCase() !== PROTOTYPE_PASSWORD) {
          summary.hidden = false;
          message.hidden = false;
          group.classList.add('govuk-form-group--error');
          field.classList.add('govuk-input--error');
          summary.focus();
          return;
        }

        unlockPrototype();
        window.location.href = 'index.html';
      });
    </script>
  </body>
</html>
