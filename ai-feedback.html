<!DOCTYPE html>
<html lang="en" class="govuk-template">
  <head>
    <meta charset="utf-8">
    <title>AI feedback - Work Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0c0c">
    <link rel="icon" sizes="48x48" href="vendor/govuk/assets/images/favicon.ico">
    <link rel="stylesheet" href="vendor/govuk/govuk-frontend.min.css">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/auth.js"></script>
  </head>
  <body class="govuk-template__body">
    <script>document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');</script>

    <header data-workhub-header></header>

    <div class="govuk-width-container">
      <a href="job-title.html" class="govuk-back-link" id="feedback-back-link">Back</a>

      <main class="govuk-main-wrapper" id="main-content">
        <div class="govuk-grid-row">
          <div class="govuk-grid-column-two-thirds">

            <span class="govuk-caption-l">Personal profile</span>
            <h1 class="govuk-heading-l">AI feedback</h1>

            <p class="govuk-body" id="feedback-loading">Thinking about what you&rsquo;ve written&hellip;</p>

            <div class="govuk-warning-text" id="feedback-error" hidden>
              <span class="govuk-warning-text__icon" aria-hidden="true">!</span>
              <strong class="govuk-warning-text__text">
                <span class="govuk-visually-hidden">Warning</span>
                <span id="feedback-error-text"></span>
              </strong>
            </div>

            <div id="feedback-body" hidden>
              <h2 class="govuk-heading-s workhub-feedback-label">Overall</h2>
              <p class="govuk-body" id="feedback-summary"></p>

              <!-- rememberExpanded off, so coming back here always lands with
                   every piece of feedback collapsed. Built before GOV.UK
                   Frontend initialises it. -->
              <div class="govuk-accordion" id="feedback-accordion"
                   data-remember-expanded="false"></div>

              <p class="govuk-body-s govuk-hint">Responses are AI-generated and may be inaccurate.</p>

              <a href="feedback-edit.html?n=1" role="button" draggable="false" class="govuk-button" data-module="govuk-button">
                Start editing
              </a>
            </div>

          </div>
        </div>
      </main>
    </div>

    <footer class="govuk-footer" data-workhub-footer></footer>

    <script type="module" src="assets/chrome.js"></script>
    <script src="assets/store.js"></script>
    <script src="assets/flows.js"></script>
    <script src="assets/ai-flow.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        /* Back retraces the way in: "We need more about you" sits between the
           job title and this page whenever a section is still Not started.
           Once none are, that page only forwards here, so Back skips it. */
        if (outstandingSections().length) {
          document.getElementById('feedback-back-link').href = 'more-about-you.html';
        }

        const loading = document.getElementById('feedback-loading');
        const body = document.getElementById('feedback-body');
        const accordion = document.getElementById('feedback-accordion');

        function render(feedback) {
          document.getElementById('feedback-summary').textContent = feedback.summary;

          accordion.innerHTML = feedback.items.map(function (item, i) {
            const n = i + 1;
            /* GOV.UK Frontend 6 folded blue into the default tag, so an
               unmodified tag is the blue one. */
            const tag = item.mustChange
              ? '<strong class="govuk-tag workhub-must-change">Must change</strong>'
              : '';
            return '<div class="govuk-accordion__section">' +
              '<div class="govuk-accordion__section-header">' +
                '<h2 class="govuk-accordion__section-heading">' +
                  '<span class="govuk-accordion__section-button" id="feedback-heading-' + n + '">' +
                    escapeHtml(item.title) + '</span>' +
                '</h2>' +
                (tag ? '<div class="govuk-accordion__section-summary govuk-body">' + tag + '</div>' : '') +
              '</div>' +
              '<div id="feedback-content-' + n + '" class="govuk-accordion__section-content">' +
                '<p class="govuk-body">' + escapeHtml(item.details) + '</p>' +
                '<p class="govuk-body">' +
                  '<a class="govuk-link" href="feedback-edit.html?n=' + n + '">Start editing' +
                    '<span class="govuk-visually-hidden"> ' + escapeHtml(item.title) + '</span></a>' +
                '</p>' +
              '</div>' +
            '</div>';
          }).join('');

          loading.hidden = true;
          body.hidden = false;

          /* GOV.UK Frontend has already run by now, so the accordion has to be
             started by hand once its sections exist. */
          accordion.setAttribute('data-module', 'govuk-accordion');
          window.initAccordion(accordion);
        }

        requestFeedback().then(render).catch(function (error) {
          /* Keep the prototype walkable when the API is unreachable. */
          document.getElementById('feedback-error-text').textContent =
            'Showing example feedback: ' + error.message;
          document.getElementById('feedback-error').hidden = false;
          render(PLACEHOLDER_FEEDBACK);
        });
      });
    </script>
  </body>
</html>
