<!DOCTYPE html>
<html lang="en" class="govuk-template">
  <head>
    <meta charset="utf-8">
    <title>Add qualification details - Work Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0c0c">
    <link rel="icon" sizes="48x48" href="vendor/govuk/assets/images/favicon.ico">
    <link rel="stylesheet" href="vendor/govuk/govuk-frontend.min.css">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/auth.js"></script>
  </head>
  <body class="govuk-template__body">
    <script>document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');</script>

    <header data-workhub-header></header>

    <div class="govuk-width-container">
      <a href="education-info.html" class="govuk-back-link">Back</a>

      <main class="govuk-main-wrapper" id="main-content">
        <div class="govuk-grid-row">
          <div class="govuk-grid-column-two-thirds">

            <span class="govuk-caption-l">Education and training</span>
            <h1 class="govuk-heading-l">Add qualification details</h1>

            <form id="education-form" novalidate>
            <div class="govuk-form-group">
              <label class="govuk-label govuk-label--s" for="courseType">Type of qualification</label>
              <div id="courseType-hint" class="govuk-hint">For example, 'GCSE', 'Basic Accounting' or 'Bachelor of Science (BSc)'.</div>
              <input class="govuk-input" id="courseType" name="courseType" type="text" aria-describedby="courseType-hint">
            </div>
            <div class="govuk-form-group">
              <label class="govuk-label govuk-label--s" for="institution">School or institution</label>
              <input class="govuk-input" id="institution" name="institution" type="text">
            </div>
              <button type="submit" class="govuk-button" data-module="govuk-button">Continue</button>
            </form>

          </div>
        </div>
      </main>
    </div>

    <footer class="govuk-footer" data-workhub-footer></footer>

    <script type="module" src="assets/chrome.js"></script>
    <script src="assets/store.js"></script>
    <script src="assets/flows.js"></script>
    <script src="assets/education.js"></script>
  </body>
</html>
