<!DOCTYPE html>
<html lang="en" class="govuk-template">
  <head>
    <meta charset="utf-8">
    <title>CV Builder Personal profile AI feedback prototype</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0c0c">
    <link rel="icon" sizes="48x48" href="vendor/govuk/assets/images/favicon.ico">
    <link rel="stylesheet" href="vendor/govuk/govuk-frontend.min.css">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/auth.js"></script>
  </head>
  <body class="govuk-template__body">
    <script>document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');</script>

    <header data-workhub-header="minimal"></header>

    <div class="govuk-width-container">
      <main class="govuk-main-wrapper" id="main-content">
        <div class="govuk-grid-row">
          <div class="govuk-grid-column-two-thirds">

            <h1 class="govuk-heading-l">AI Feedback on Personal Profile</h1>

            <h2 class="govuk-heading-m">Option 1</h2>

            <ul class="govuk-list govuk-list--bullet">
              <li>Radio button as AI feedback branching</li>
              <li>Personal profile as the last section of optional section</li>
            </ul>

            <a href="task-list.html?option=1" data-prototype-start role="button" draggable="false" class="govuk-button" data-module="govuk-button">
              Go to prototype
            </a>

            <h2 class="govuk-heading-m">Option 2</h2>

            <ul class="govuk-list govuk-list--bullet">
              <li>Personal profile as it's own section</li>
              <li>Action links as AI feedback branching</li>
            </ul>

            <a href="task-list.html?option=2" data-prototype-start role="button" draggable="false" class="govuk-button" data-module="govuk-button">
              Go to prototype
            </a>

          </div>
        </div>
      </main>
    </div>

    <script type="module" src="assets/chrome.js"></script>
    <script src="assets/store.js"></script>
    <script>
      /* Each run starts from scratch, so both options open on a task list with
         every section Not started. */
      document.querySelectorAll('a[data-prototype-start]').forEach(function (link) {
        link.addEventListener('click', function () {
          Store.clear();
          /* Drop anything left over from a previous run too: a success banner
             waiting to be shown, or a half-finished detour. */
          Flash.take();
          Return.take();
        });
      });
    </script>
  </body>
</html>
