<!DOCTYPE html>
<html lang="en" class="govuk-template">
  <head>
    <meta charset="utf-8">
    <title>AI CV Personal profile feedback prototype</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0c0c">
    <link rel="icon" sizes="48x48" href="vendor/govuk/assets/images/favicon.ico">
    <link rel="stylesheet" href="vendor/govuk/govuk-frontend.min.css">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/auth.js"></script>
  </head>
  <body class="govuk-template__body">
    <script>document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');</script>

    <header data-workhub-header="minimal"></header>

    <div class="govuk-width-container">
      <main class="govuk-main-wrapper" id="main-content">
        <div class="govuk-grid-row">
          <div class="govuk-grid-column-two-thirds">

            <h1 class="govuk-heading-l">AI CV Personal profile feedback prototype</h1>

            <a href="task-list.html" role="button" draggable="false" class="govuk-button" data-module="govuk-button">
              Go to prototype
            </a>

            <hr class="govuk-section-break govuk-section-break--l govuk-section-break--visible">

            <h2 class="govuk-heading-m">Prototype controls</h2>
            <p class="govuk-body">Clears everything saved in this browser and returns every section to Not started.</p>

            <button type="button" class="govuk-button govuk-button--secondary" data-module="govuk-button" id="reset-prototype">
              Reset all saved answers
            </button>

          </div>
        </div>
      </main>
    </div>

    <footer class="govuk-footer" data-workhub-footer></footer>

    <script type="module" src="assets/chrome.js"></script>
    <script src="assets/store.js"></script>
    <script>
      document.getElementById('reset-prototype').addEventListener('click', function () {
        Store.clear();
        this.textContent = 'Saved answers cleared';
        this.disabled = true;
      });
    </script>
  </body>
</html>
